x-node-config: &node-config
  image: node:24-alpine
  user: "${HOST_UID}:${HOST_GID}"
  volumes:
    - ../app:/app
  working_dir: /app
  tty: true
  stdin_open: true

services:
  npm:
    <<: *node-config
    container_name: npm
    entrypoint:
      - npm
    command: ["run", "dev", "--", "--host"]
    ports:
      - "5173:5173"
