x-node-config: &node-config
  image: node:22-alpine
  user: "${HOST_UID}:${HOST_GID}"
  volumes:
    - ../app:/app
  working_dir: /app
  tty: true
  stdin_open: true
  init: true
  environment:
    NODE_ENV: development

services:
  npm:
    <<: *node-config
    container_name: npm-cli
    entrypoint:
      - npm
    environment:
      - WEBPACK_DEV_SERVER_WEBPACK_OPTIONS=${WEBPACK_DEV_SERVER_WEBPACK_OPTIONS}
      - WDS_SOCKET_PORT=${WDS_SOCKET_PORT}
      - HOST=${HOST}
      - CHOKIDAR_INTERVAL=${CHOKIDAR_INTERVAL}

  npx:
    <<: *node-config
    container_name: npx-cli
    entrypoint:
      - npx
